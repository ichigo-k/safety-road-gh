<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Safety Road GH</title>
  <meta name="theme-color" content="#146b45" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f8;
      color: #14181d;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e2e6ea;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 16px rgba(20,24,29,0.07);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #146b45;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    p  { margin-top: 10px; font-size: 14px; color: #525a64; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      background: #e9f1ec;
      color: #0c4630;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 99px;
    }
    .back {
      display: inline-block;
      margin-top: 24px;
      font-size: 13px;
      color: #146b45;
      text-decoration: none;
      font-weight: 500;
    }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>Safety Road GH</h1>
    <p>The mobile web app will be available here once the first build is deployed via the Docker pipeline.</p>
    <span class="badge">Build pending</span>
    <br />
    <a class="back" href="/">← Back to home</a>
  </div>
</body>
</html>
