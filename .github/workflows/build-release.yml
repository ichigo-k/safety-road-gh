name: Build Android APK, iOS PWA & Web Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pwa:
    name: Build iOS & Universal Web PWA Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Export Expo iOS & Web PWA Bundle
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_AZURE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
        run: |
          cd mobile
          npx expo export --platform web

      - name: Package iOS & Universal PWA Bundles
        run: |
          cd mobile
          zip -r ../SafetyRoadGH-iOS-PWA.zip dist/
          cp ../SafetyRoadGH-iOS-PWA.zip ../SafetyRoadGH-PWA.zip

      - name: Upload iOS PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyRoadGH-iOS-PWA
          path: SafetyRoadGH-iOS-PWA.zip

  build-android:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Generate Android Native Prebuild
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_AZURE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Grant Execute Permission for Gradle
        run: |
          cd mobile/android
          chmod +x gradlew

      # Writes the release keystore from a base64 secret. Skipped when the
      # secret is absent, in which case withReleaseSigning.js falls back to the
      # debug keystore and the build still succeeds — unsigned-for-Play, but
      # installable, which is what every build did before this existed.
      - name: Decode Release Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Android APK Release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_AZURE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Rename APK File
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" SafetyRoadGH.apk
            echo "APK generated successfully at SafetyRoadGH.apk"
          else
            echo "Error: APK build output file not found."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyRoadGH-Android-APK
          path: SafetyRoadGH.apk

  create-release:
    name: Create GitHub Release
    needs: [build-pwa, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download iOS PWA Artifact
        uses: actions/download-artifact@v4
        with:
          name: SafetyRoadGH-iOS-PWA

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: SafetyRoadGH-Android-APK

      - name: Generate Release Tag Name
        id: tag
        run: |
          TAG_NAME="v1.0.0-$(date +'%Y%m%d%H%M')"
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Safety Road GH Release ${{ steps.tag.outputs.release_tag }}
          body: |
            ### Safety Road GH Downloadable Assets

            - **Android APK**: `SafetyRoadGH.apk` (Install directly on Android phones)
            - **iOS PWA Bundle**: `SafetyRoadGH-iOS-PWA.zip` (Optimized for iOS Safari "Add to Home Screen" standalone app mode)
            - **Universal Web PWA**: `SafetyRoadGH-PWA.zip`

            *Embedded Backend API URL:* Embedded from GitHub Secrets (`EXPO_PUBLIC_API_URL` / `BACKEND_URL`).
          draft: false
          prerelease: false
          files: |
            SafetyRoadGH.apk
            SafetyRoadGH-iOS-PWA.zip
            SafetyRoadGH-PWA.zip
