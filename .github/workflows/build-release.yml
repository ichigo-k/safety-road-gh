name: Build Android APK, iOS PWA & Web Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pwa:
    name: Build iOS & Universal Web PWA Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Export Expo iOS & Web PWA Bundle
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_AZURE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
        run: |
          cd mobile
          npx expo export --platform web

      - name: Package iOS & Universal PWA Bundles
        run: |
          cd mobile
          zip -r ../SafetyRoadGH-iOS-PWA.zip dist/
          cp ../SafetyRoadGH-iOS-PWA.zip ../SafetyRoadGH-PWA.zip

      - name: Upload iOS PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyRoadGH-iOS-PWA
          path: SafetyRoadGH-iOS-PWA.zip

  build-android:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Generate Android Native Prebuild
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_AZURE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Grant Execute Permission for Gradle
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Android APK Release
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
          EXPO_PUBLIC_AZURE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Rename APK File
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" SafetyRoadGH.apk
            echo "APK generated successfully at SafetyRoadGH.apk"
          else
            echo "Error: APK build output file not found."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyRoadGH-Android-APK
          path: SafetyRoadGH.apk

  build-docker:
    name: Build & Push Web Docker Image
    # Runs after the release so the published image contains the same app
    # version the download button points at. Without this ordering the site
    # could advertise a release whose PWA it does not yet serve.
    needs: [create-release]
    runs-on: ubuntu-latest
    # Only publish images from the default branch and tags — a PR build should
    # verify, not ship.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/safety-road-gh
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          # Repo root: the Dockerfile needs mobile/ to export the bundled PWA.
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* / EXPO_PUBLIC_* are inlined by the bundler at build
          # time, so they must be build args. Runtime-only secrets
          # (DATABASE_URL, JWT_SECRET, AZURE_MAPS_KEY, SMTP, Cloudinary) are
          # deliberately NOT here — baking them into an image layer would
          # publish them to anyone who pulls it.
          build-args: |
            EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL || secrets.BACKEND_URL }}
            EXPO_PUBLIC_AZURE_MAPS_KEY=${{ secrets.EXPO_PUBLIC_AZURE_MAPS_KEY }}
            NEXT_PUBLIC_AZURE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_AZURE_MAPS_KEY }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_APK_URL=${{ secrets.NEXT_PUBLIC_APK_URL }}

      - name: Summary
        run: |
          echo "### Docker image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    needs: [build-pwa, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download iOS PWA Artifact
        uses: actions/download-artifact@v4
        with:
          name: SafetyRoadGH-iOS-PWA

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: SafetyRoadGH-Android-APK

      - name: Generate Release Tag Name
        id: tag
        run: |
          TAG_NAME="v1.0.0-$(date +'%Y%m%d%H%M')"
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Safety Road GH Release ${{ steps.tag.outputs.release_tag }}
          body: |
            ### Safety Road GH Downloadable Assets

            - **Android APK**: `SafetyRoadGH.apk` (Install directly on Android phones)
            - **iOS PWA Bundle**: `SafetyRoadGH-iOS-PWA.zip` (Optimized for iOS Safari "Add to Home Screen" standalone app mode)
            - **Universal Web PWA**: `SafetyRoadGH-PWA.zip`

            *Embedded Backend API URL:* Embedded from GitHub Secrets (`EXPO_PUBLIC_API_URL` / `BACKEND_URL`).
          draft: false
          prerelease: false
          files: |
            SafetyRoadGH.apk
            SafetyRoadGH-iOS-PWA.zip
            SafetyRoadGH-PWA.zip
